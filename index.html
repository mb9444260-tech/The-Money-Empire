<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطورية المال - لعبة محاكاة اقتصادية</title>
    <style>
        :root {
            --bg-color: #060911;
            --card-bg: #0d1322;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #22c55e;
            --yellow: #eab308;
            --blue: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 10px; display: flex; justify-content: center; }
        .game-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        h1 { font-size: 1rem; color: var(--yellow); text-align: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; font-size: 0.8rem; font-family: monospace; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; }
        button { border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .btn-main { background-color: var(--yellow); color: #060911; width: 100%; }
        .btn-save { background-color: var(--green); color: #060911; }
        .btn-cloud { background-color: var(--blue); color: white; }
        input { background: #060911; border: 1px solid var(--border-color); border-radius: 4px; padding: 8px; color: var(--text-main); font-size: 0.8rem; width: 100%; text-align: center; }
        .row { display: flex; gap: 6px; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>👑 إمبراطورية المال والاقتصاد</h1>

    <!-- قسم تسجيل وتثبيت اسم المستثمر -->
    <div class="card">
        <label style="font-size: 0.75rem; color: var(--yellow);">اسم مستخدم الإمبراطورية الخاص بك:</label>
        <div class="row">
            <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا...">
            <button class="btn-cloud" onclick="saveUsername()" style="width: 100px;">تثبيت الاسم</button>
        </div>
    </div>

    <!-- لوحة المؤشرات الأساسية -->
    <div class="card">
        <div style="font-size: 0.8rem; font-weight: bold; color: var(--yellow);">📊 مؤشرات الإمبراطورية:</div>
        <div class="stats-grid">
            <div>💰 النقد: $<span id="moneyDisplay">10,000</span></div>
            <div>📅 اليوم: <span id="dayDisplay">1</span></div>
            <div>🏦 القرض: $<span id="loanDisplay">0</span></div>
            <div>📜 السندات: <span id="bondsDisplay">0</span></div>
        </div>
        <button class="btn-main" onclick="nextDay()">مرور يوم جديد ⏳</button>
    </div>

    <!-- أزرار الحفظ والاسترجاع السحابي -->
    <div class="card">
        <div style="font-size: 0.8rem; font-weight: bold; color: var(--green);">☁️ الحفظ السحابي (عبر فايربيس):</div>
        <div class="row">
            <button class="btn-save" onclick="saveGameOnline()" style="flex: 1;">حفظ سحابي 💾</button>
            <button class="btn-cloud" onclick="loadGameOnline()" style="flex: 1;">استرجاع سحابي 🔄</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDjmtuNuQf6zQwiHeRbbIWI19XdVJzyuU",
        authDomain: "money-imperator.firebaseapp.com",
        projectId: "money-imperator",
        storageBucket: "money-imperator.firebasestorage.app",
        messagingSenderId: "970812493430",
        appId: "1:970812493430:web:ba86a9effdd7e92430d957",
        measurementId: "G-HSJTS6DEJR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.money = 10000;
    window.day = 1;
    window.loan = 0;
    window.bondsOwned = 0;

    window.getPlayerId = function() {
        let pId = localStorage.getItem("game_player_id");
        if (!pId) {
            pId = "player_" + Math.random().toString(36).substr(2, 9);
            localStorage.setItem("game_player_id", pId);
        }
        return pId;
    };

    window.updateUI = function() {
        document.getElementById('moneyDisplay').innerText = window.money.toLocaleString();
        document.getElementById('dayDisplay').innerText = window.day;
        document.getElementById('loanDisplay').innerText = window.loan.toLocaleString();
        document.getElementById('bondsDisplay').innerText = window.bondsOwned;
    };

    window.nextDay = function() {
        window.day++;
        window.money += 1500;
        updateUI();
    };

    // حفظ وتثبيت الاسم محلياً وفورياً
    window.saveUsername = function() {
        const username = document.getElementById('usernameInput').value.trim();
        if (username) {
            localStorage.setItem("game_username", username);
            alert(`✅ تم تثبيت الاسم (${username}) بنجاح! اضغط الآن على "حفظ سحابي" ليرتفع لقاعدة البيانات.`);
        } else {
            alert("❌ الرجاء كتابة اسم مستخدم صحيح.");
        }
    };

    // الحفظ السحابي مع إرسال الاسم بشكل إجباري
    window.saveGameOnline = async function() {
        const userId = getPlayerId();
        const inputVal = document.getElementById('usernameInput').value.trim();
        const finalUsername = inputVal || localStorage.getItem("game_username") || "مستثمر مجهول";

        // تخزين الاسم للاحتياط
        localStorage.setItem("game_username", finalUsername);

        try {
            await setDoc(doc(db, "players", userId), {
                username: finalUsername, // إرسال الاسم لفايربيس بضمان تام
                money: window.money,
                day: window.day,
                loan: window.loan,
                bondsOwned: window.bondsOwned,
                lastUpdated: new Date()
            }, { merge: true });
            
            alert(`🚀 تم الحفظ السحابي بنجاح باسم: (${finalUsername})!`);
        } catch (e) { 
            console.error(e); 
            alert("❌ حدث خطأ أثناء الاتصال بقاعدة البيانات."); 
        }
    };

    window.loadGameOnline = async function() {
        const userId = getPlayerId();
        try {
            const playerSnap = await getDoc(doc(db, "players", userId));
            if (playerSnap.exists()) {
                const data = playerSnap.data();
                window.money = data.money || 10000;
                window.day = data.day || 1;
                window.loan = data.loan || 0;
                window.bondsOwned = data.bondsOwned || 0;
                
                if (data.username) {
                    document.getElementById('usernameInput').value = data.username;
                    localStorage.setItem("game_username", data.username);
                }
                
                updateUI();
                alert("📥 تم استرجاع بيانات الإمبراطورية بنجاح!");
            } else {
                alert("⚠️ لا يوجد حفظ سحابي مرتبط بهذا الجهاز بعد.");
            }
        } catch (e) {
            console.error(e);
            alert("❌ حدث خطأ أثناء الاسترجاع.");
        }
    };

    window.addEventListener('DOMContentLoaded', () => {
        const savedName = localStorage.getItem("game_username");
        if (savedName && document.getElementById('usernameInput')) {
            document.getElementById('usernameInput').value = savedName;
        }
        updateUI();
    });
</script>

</body>
</html>

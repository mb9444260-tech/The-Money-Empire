<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إمبراطورية المال - لعبة محاكاة اقتصادية</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            padding: 15px;
            display: flex;
            justify-content: center;
            margin: 0;
        }
        .game-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card {
            background-color: #131b2e;
            border: 1px solid #2a3a5e;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        h1 {
            font-size: 1.2rem;
            color: #eab308;
            text-align: center;
            margin: 0 0 5px 0;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            font-size: 0.85rem;
            font-family: monospace;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2a3a5e;
        }
        button {
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            width: 100%;
        }
        .btn-main { background-color: #eab308; color: #0b0f19; }
        .btn-save { background-color: #22c55e; color: #0b0f19; }
        .btn-cloud { background-color: #3b82f6; color: white; }
        .btn-action { background-color: #6366f1; color: white; width: 120px; }
        input {
            background: #1e293b;
            border: 1px solid #2a3a5e;
            border-radius: 6px;
            padding: 10px;
            color: #ffffff;
            font-size: 0.9rem;
            width: 100%;
            text-align: center;
        }
        label {
            font-size: 0.85rem;
            color: #eab308;
            font-weight: bold;
        }
        .row {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>👑 إمبراطورية المال والاقتصاد</h1>

    <!-- قسم اسم المستخدم -->
    <div class="card">
        <label>اسم مستخدم الإمبراطورية:</label>
        <div class="row">
            <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا...">
            <button class="btn-action" onclick="saveUsername()">تثبيت الاسم</button>
        </div>
    </div>

    <!-- مؤشرات اللعبة -->
    <div class="card">
        <label>📊 مؤشرات الإمبراطورية:</label>
        <div class="stats-grid">
            <div>💰 النقد: $<span id="moneyDisplay">10,000</span></div>
            <div>📅 اليوم: <span id="dayDisplay">1</span></div>
            <div>🏦 القرض: $<span id="loanDisplay">0</span></div>
            <div>📜 السندات: <span id="bondsDisplay">0</span></div>
        </div>
        <button class="btn-main" onclick="nextDay()">مرور يوم جديد ⏳</button>
    </div>

    <!-- أزرار الحفظ -->
    <div class="card">
        <label>☁️ الحفظ السحابي (فايربيس):</label>
        <button class="btn-save" onclick="saveGameOnline()">حفظ سحابي 💾</button>
        <button class="btn-cloud" onclick="loadGameOnline()">استرجاع سحابي 🔄</button>
    </div>
</div>

<!-- ربط فايربيس وتشغيل الدوال بشكل صحيح وعالمي -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDjmtuNuQf6zQwiHeRbbIWI19XdVJzyuU",
        authDomain: "money-imperator.firebaseapp.com",
        projectId: "money-imperator",
        storageBucket: "money-imperator.firebasestorage.app",
        messagingSenderId: "970812493430",
        appId: "1:970812493430:web:ba86a9effdd7e92430d957",
        measurementId: "G-HSJTS6DEJR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // متغيرات اللعبة
    let money = 10000;
    let day = 1;
    let loan = 0;
    let bondsOwned = 0;

    function getPlayerId() {
        let pId = localStorage.getItem("game_player_id");
        if (!pId) {
            pId = "player_" + Math.random().toString(36).substr(2, 9);
            localStorage.setItem("game_player_id", pId);
        }
        return pId;
    }

    function updateUI() {
        document.getElementById('moneyDisplay').innerText = money.toLocaleString();
        document.getElementById('dayDisplay').innerText = day;
        document.getElementById('loanDisplay').innerText = loan.toLocaleString();
        document.getElementById('bondsDisplay').innerText = bondsOwned;
    }

    // ربط الدوال بنافذة المتصفح لتعمل الأزرار الخارجية مباشرة
    window.nextDay = function() {
        day++;
        money += 1500;
        updateUI();
    };

    window.saveUsername = function() {
        const username = document.getElementById('usernameInput').value.trim();
        if (username) {
            localStorage.setItem("game_username", username);
            alert(`✅ تم تثبيت الاسم (${username}) محلياً!`);
        } else {
            alert("❌ الرجاء كتابة اسم مستخدم صحيح.");
        }
    };

    window.saveGameOnline = async function() {
        const userId = getPlayerId();
        const inputVal = document.getElementById('usernameInput').value.trim();
        const finalUsername = inputVal || localStorage.getItem("game_username") || "مستثمر_" + userId.slice(-4);

        localStorage.setItem("game_username", finalUsername);

        try {
            await setDoc(doc(db, "players", userId), {
                username: finalUsername,
                money: money,
                day: day,
                loan: loan,
                bondsOwned: bondsOwned,
                lastUpdated: new Date()
            }, { merge: true });
            
            alert(`🚀 تم الحفظ السحابي بنجاح باسم: (${finalUsername})!`);
        } catch (e) { 
            console.error(e); 
            alert("❌ حدث خطأ أثناء الاتصال بقاعدة البيانات."); 
        }
    };

    window.loadGameOnline = async function() {
        const userId = getPlayerId();
        try {
            const playerSnap = await getDoc(doc(db, "players", userId));
            if (playerSnap.exists()) {
                const data = playerSnap.data();
                money = data.money || 10000;
                day = data.day || 1;
                loan = data.loan || 0;
                bondsOwned = data.bondsOwned || 0;
                
                if (data.username) {
                    document.getElementById('usernameInput').value = data.username;
                    localStorage.setItem("game_username", data.username);
                }
                
                updateUI();
                alert("📥 تم استرجاع بيانات الإمبراطورية بنجاح!");
            } else {
                alert("⚠️ لا يوجد حفظ سحابي مرتبط بهذا الجهاز بعد.");
            }
        } catch (e) {
            console.error(e);
            alert("❌ حدث خطأ أثناء الاسترجاع.");
        }
    };

    // عند تحميل الصفحة
    window.addEventListener('DOMContentLoaded', () => {
        const savedName = localStorage.getItem("game_username");
        if (savedName && document.getElementById('usernameInput')) {
            document.getElementById('usernameInput').value = savedName;
        }
        updateUI();
    });
</script>

</body>
</html>

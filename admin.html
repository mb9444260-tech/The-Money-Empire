<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والإدارة (Admin Panel) | إمبراطورية التجارة</title>
    <style>
        :root {
            --bg-color: #060911;
            --card-bg: #0d1322;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --blue: #3b82f6;
            --yellow: #eab308;
            --gem: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        header {
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.3rem;
            color: var(--yellow);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .stat-val {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
            color: var(--green);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--yellow);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .search-box {
            background-color: #162032;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
        }

        .player-row {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--blue);
        }

        .player-info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 4px;
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 6px;
            align-items: center;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .input-label {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .admin-input {
            background-color: #060911;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 6px;
            color: var(--text-main);
            font-size: 0.75rem;
            width: 100%;
            outline: none;
        }

        .admin-input:focus {
            border-color: var(--yellow);
        }

        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn-green { background-color: var(--green); color: #060911; }
        .btn-blue { background-color: var(--blue); }
        .btn-red { background-color: var(--red); }
        .btn-gem { background-color: var(--gem); color: #060911; }

        #loginSection {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة حماية دخول الأدمن -->
    <div id="loginSection" class="card">
        <h2 style="color: var(--yellow); font-size: 1.1rem;">👑 تسجيل دخول لوحة الإدارة</h2>
        <input type="password" id="adminPassInput" class="search-box" placeholder="كلمة سر الأدمن...">
        <button class="btn btn-green" style="padding: 10px; width: 100%; margin-top: 5px;" onclick="checkAdminAuth()">دخول اللوحة 🔑</button>
    </div>

    <!-- المحتوى الرئيسي للوحة الأدمن -->
    <div id="adminMainContent" style="display: none; flex-direction: column; gap: 12px;">
        <header>
            <h1>⚙️ لوحة مراقبة وإدارة اللاعبين الشاملة</h1>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">إجمالي الحسابات</div>
                <div class="stat-val" id="totalPlayersCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">إجمالي السيولة ($)</div>
                <div class="stat-val" id="totalMoneyCount" style="color: var(--yellow);">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">إجمالي الجواهر (💎)</div>
                <div class="stat-val" id="totalGemsCount" style="color: var(--gem);">0</div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">🔍 البحث عن لاعب</div>
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم المستخدم..." oninput="filterPlayers()">
        </div>

        <div class="card">
            <div class="section-title">👥 قائمة حسابات اللاعبين والتحكم الكامل</div>
            <div class="players-list" id="playersList">
                <div style="text-align: center; color: var(--text-muted); padding: 10px;">جاري تحميل البيانات...</div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDjmtuNuQf6zQwiHeRbbIWI19XdVJzyuU",
        authDomain: "money-imperator.firebaseapp.com",
        projectId: "money-imperator",
        storageBucket: "money-imperator.firebasestorage.app",
        messagingSenderId: "970812493430",
        appId: "1:970812493430:web:ba86a9effdd7e92430d957",
        measurementId: "G-HSJTS6DEJR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allPlayers = [];
    const ADMIN_PASSWORD = "admin1"; // يمكنك تعديل كلمة سر الأدمن من هنا

    window.checkAdminAuth = function() {
        const inputPass = document.getElementById('adminPassInput').value.trim();
        if (inputPass === ADMIN_PASSWORD) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminMainContent').style.display = 'flex';
            loadAllPlayers();
        } else {
            alert("❌ كلمة المرور غير صحيحة!");
        }
    };

    async function loadAllPlayers() {
        const container = document.getElementById('playersList');
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted);">جاري الاتصال بالسيرفر...</div>';
        
        try {
            const querySnapshot = await getDocs(collection(db, "players_accounts"));
            allPlayers = [];
            let totalMoney = 0;
            let totalGems = 0;

            querySnapshot.forEach((docSnap) => {
                let data = docSnap.data();
                data.id = docSnap.id;
                allPlayers.push(data);
                totalMoney += (data.money || 0);
                totalGems += (data.gems || 0);
            });

            document.getElementById('totalPlayersCount').innerText = allPlayers.length;
            document.getElementById('totalMoneyCount').innerText = '$' + totalMoney.toLocaleString();
            document.getElementById('totalGemsCount').innerText = totalGems.toLocaleString();

            renderPlayers(allPlayers);
        } catch (e) {
            console.error(e);
            container.innerHTML = '<div style="text-align: center; color: var(--red);">❌ فشل في جلب بيانات اللاعبين!</div>';
        }
    }

    function renderPlayers(players) {
        const container = document.getElementById('playersList');
        container.innerHTML = '';

        if (players.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted);">لا يوجد لاعبين مطابقين للبحث.</div>';
            return;
        }

        players.forEach((p) => {
            container.innerHTML += `
                <div class="player-row">
                    <div class="player-header">
                        <span class="player-name">👤 ${p.username || p.id}</span>
                        <span style="font-size: 0.7rem; color: var(--text-muted);">معرف المستند: ${p.id}</span>
                    </div>

                    <div class="player-info-grid">
                        <div>💰 النقد: $${(p.money || 0).toLocaleString()}</div>
                        <div>💎 الجواهر: ${p.gems || 0}</div>
                        <div>🏦 الدين: $${(p.loan || 0).toLocaleString()}</div>
                        <div>📅 اليوم: ${p.day || 1}</div>
                    </div>

                    <div class="control-group">
                        <div class="input-wrapper">
                            <span class="input-label">اسم المستخدم</span>
                            <input type="text" id="username_${p.id}" class="admin-input" value="${p.username || ''}">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">كلمة المرور</span>
                            <input type="text" id="password_${p.id}" class="admin-input" value="${p.password || ''}">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">النقد السائل ($)</span>
                            <input type="number" id="money_${p.id}" class="admin-input" value="${p.money || 0}">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">الجواهر (💎)</span>
                            <input type="number" id="gems_${p.id}" class="admin-input" value="${p.gems || 0}">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">اليوم التكتيكي</span>
                            <input type="number" id="day_${p.id}" class="admin-input" value="${p.day || 1}">
                        </div>
                        <div class="input-wrapper">
                            <span class="input-label">قيمة الدين ($)</span>
                            <input type="number" id="loan_${p.id}" class="admin-input" value="${p.loan || 0}">
                        </div>
                    </div>

                    <div class="btn-row">
                        <button class="btn btn-green" onclick="savePlayerFullData('${p.id}')">حفظ كافة التعديلات 💾</button>
                        <button class="btn btn-gem" onclick="resetLockAndCycle('${p.id}')">فك القفل والانتظار 🔓</button>
                        <button class="btn btn-red" onclick="deletePlayerAccount('${p.id}')">حذف الحساب 🗑️</button>
                    </div>
                </div>
            `;
        });
    }

    window.filterPlayers = function() {
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        const filtered = allPlayers.filter(p => (p.username || p.id).toLowerCase().includes(q));
        renderPlayers(filtered);
    };

    window.savePlayerFullData = async function(docId) {
        const newUsername = document.getElementById(`username_${docId}`).value.trim();
        const newPassword = document.getElementById(`password_${docId}`).value.trim();
        const newMoney = parseInt(document.getElementById(`money_${docId}`).value) || 0;
        const newGems = parseInt(document.getElementById(`gems_${docId}`).value) || 0;
        const newDay = parseInt(document.getElementById(`day_${docId}`).value) || 1;
        const newLoan = parseInt(document.getElementById(`loan_${docId}`).value) || 0;

        try {
            const playerRef = doc(db, "players_accounts", docId);
            await updateDoc(playerRef, {
                username: newUsername,
                password: newPassword,
                money: newMoney,
                gems: newGems,
                day: newDay,
                loan: newLoan
            });
            alert(`✅ تم تحديث بيانات اللاعب وحفظها بنجاح!`);
            loadAllPlayers();
        } catch (e) {
            console.error(e);
            alert("❌ حدث خطأ أثناء الحفظ.");
        }
    };

    window.resetLockAndCycle = async function(docId) {
        try {
            const playerRef = doc(db, "players_accounts", docId);
            await updateDoc(playerRef, {
                isLocked: false,
                daysPlayedInCycle: 0
            });
            alert("✅ تم فك القفل وتصفير أيام الانتظار للاعب بنجاح!");
            loadAllPlayers();
        } catch (e) {
            console.error(e);
            alert("❌ حدث خطأ أثناء العملية.");
        }
    };

    window.deletePlayerAccount = async function(docId) {
        if (confirm(`⚠️ هل أنت متأكد تماماً من حذف حساب اللاعب (${docId})؟ لا يمكن التراجع!`)) {
            try {
                await deleteDoc(doc(db, "players_accounts", docId));
                alert("🗑️ تم حذف الحساب بنجاح.");
                loadAllPlayers();
            } catch (e) {
                console.error(e);
                alert("❌ فشل في حذف الحساب.");
            }
        }
    };
</script>

</body>
</html>
